name: "Terraform IaC CI/CD"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-and-scan:
    name: "Lint, Validate & Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: "Terraform Format Check"
        run: terraform fmt -check

      - name: "Terraform Init (Validation Mode)"
        run: terraform init -backend=false

      - name: "Terraform Validate"
        run: terraform validate

      - name: "Run Checkov IaC Security Scan"
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/tf" \
            bridgecrew/checkov:3.2.34 \
            -d /tf \
            --framework terraform \
            --compact \
            --soft-fail

  plan:
    name: "Terraform Plan"
    needs: validate-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Azure Login via OIDC"
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: "Terraform Init (Remote Backend)"
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          
          # Validacao defensiva de presenca das variaveis
          if [ -z "${{ vars.AZURE_BACKEND_RG }}" ] || [ -z "${{ vars.AZURE_BACKEND_STORAGE_ACCOUNT }}" ] || [ -z "${{ vars.AZURE_BACKEND_CONTAINER }}" ]; then
            echo "Erro: Variaveis de backend nao configuradas em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

          terraform init \
            -backend-config="resource_group_name=${{ vars.AZURE_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ vars.AZURE_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.AZURE_BACKEND_CONTAINER }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: "Terraform Plan"
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -out=tfplan -no-color

      - name: "Upload Terraform Plan Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1